name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned so CI and a local ruff behave the same; bump deliberately
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v3.1
        with:
          version: "0.17.2"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v3.1
        with:
          version: "0.17.2"
          args: "format --check"
      - run: python3 -m unittest discover -v
